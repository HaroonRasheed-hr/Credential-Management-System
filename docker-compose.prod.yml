version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: xis_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Error: POSTGRES_DB not set}
      POSTGRES_USER: ${POSTGRES_USER:?Error: POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD not set}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Error: NEXT_PUBLIC_API_URL not set}
    container_name: xis_backend_prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:?Error: DEBUG not set}
      - SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY not set}
      - FERNET_KEY=${FERNET_KEY:?Error: FERNET_KEY not set}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:?Error: JWT_SIGNING_KEY not set}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Error: ALLOWED_HOSTS not set}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Error: CORS_ALLOWED_ORIGINS not set}
      - REDIS_URL=${REDIS_URL:?Error: REDIS_URL not set}
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Error: POSTGRES_USER not set}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD not set}@db:5432/${POSTGRES_DB:?Error: POSTGRES_DB not set}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
    driver: local
